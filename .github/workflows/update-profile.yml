name: Update profile

run-name: Update profile / ${{ inputs.correlation_id || github.event_name }}

on:
  pull_request:
  schedule:
    - cron: "17 19 * * *"
  workflow_dispatch:
    inputs:
      correlation_id:
        description: Optional identifier for a manual verification run
        required: false
        type: string
      dry_run:
        description: Generate and validate assets without committing or pushing
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: update-profile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-profile:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Validate Profile contract
        run: python -m unittest discover -s tests -v

  update-profile:
    # Only the default branch may publish refreshed assets. A manual run on a
    # feature branch would otherwise rewrite that branch's copy of the SVGs and
    # let it drift from main.
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DRY_RUN: ${{ inputs.dry_run == true }}
    steps:
      - name: Check out default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # Source: https://github.com/yoshi389111/github-profile-3d-contrib
      # Release: v0.9.3 (MIT)
      - name: Generate upstream Profile assets
        uses: yoshi389111/github-profile-3d-contrib@7d95e7d4cdc028dd1e1cbd957d65f35efb12ae39
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      # The upstream GitBlock asset hard-codes a light palette, which renders as
      # a bright white block under GitHub's dark theme. Appending a media query
      # repaints only the neutral surfaces and text; the contribution colour
      # ramp is deliberately left on its upstream values.
      - name: Inject dark colour palette
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          ASSET = Path("profile-3d-contrib/profile-gitblock.svg")

          DARK_PALETTE = """
          @media (prefers-color-scheme: dark) {
            .fill-bg { fill: #0d1117; }
            .stroke-bg { stroke: #0d1117; }
            .fill-fg { fill: #e6edf3; }
            .stroke-fg { stroke: #e6edf3; }
            .fill-strong { fill: #f0f6fc; }
            .fill-weak { fill: #7d8590; }
            .stroke-weak { stroke: #7d8590; }
            .cont-top-bg-0 { fill: #21262d; }
            .cont-top-fg-0 { fill: #484f58; }
            .cont-right-bg-0 { fill: rgb(60, 68, 77); }
            .cont-right-fg-0 { fill: rgb(139, 148, 158); }
            .cont-left-bg-0 { fill: rgb(48, 54, 61); }
            .cont-left-fg-0 { fill: rgb(110, 118, 129); }
          }
          """

          source = ASSET.read_text(encoding="utf-8")
          if "prefers-color-scheme" in source:
              print("Dark palette already present; leaving the asset untouched.")
          else:
              marker = "</style>"
              if marker not in source:
                  raise SystemExit("GitBlock asset has no </style> element to extend.")
              index = source.index(marker)
              ASSET.write_text(
                  source[:index] + DARK_PALETTE + source[index:], encoding="utf-8"
              )
              print("Injected the dark palette into the GitBlock asset.")

          # Fail loudly if the upstream markup ever stops matching, otherwise the
          # palette would silently stop being applied.
          assert "prefers-color-scheme" in ASSET.read_text(encoding="utf-8")
          PY

      - name: Validate GitBlock output
        run: |
          set -euo pipefail
          test -s profile-3d-contrib/profile-gitblock.svg
          python - <<'PY'
          import xml.etree.ElementTree as ET

          root = ET.parse("profile-3d-contrib/profile-gitblock.svg").getroot()
          assert root.tag.rsplit("}", 1)[-1] == "svg"
          PY

      # Re-run the full contract suite against the freshly generated SVGs so a
      # changed upstream output can never be committed to main unvalidated.
      - name: Validate Profile contract against generated assets
        run: python -m unittest discover -s tests -v

      - name: Summarise generated assets
        if: always()
        run: |
          set -euo pipefail
          {
            echo "### Profile refresh summary"
            echo ""
            echo "| Asset | Bytes | Rects | Animations |"
            echo "|-------|-------|-------|------------|"
            for file in profile-3d-contrib/*.svg; do
              # "|| true" keeps pipefail from aborting the loop on the static
              # themes, where grep legitimately finds no <animate> element.
              rects=$(grep -o '<rect' "$file" | wc -l || true)
              animated=$(grep -o '<animate' "$file" | wc -l || true)
              printf '| %s | %s | %s | %s |\n' \
                "$(basename "$file")" "$(wc -c < "$file")" "$rects" "$animated"
            done
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${DRY_RUN}" = "true" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Dry run: no commit or push was attempted." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit generated Profile assets
        if: env.DRY_RUN != 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- profile-3d-contrib/
          if git diff --cached --quiet; then
            echo "Profile assets are unchanged."
            exit 0
          fi
          git commit -m "chore: refresh profile activity"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          for attempt in 1 2 3; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            sleep $((attempt * 5))
            git pull --rebase origin "${GITHUB_REF_NAME}"
          done
          echo "Push to ${GITHUB_REF_NAME} failed after 3 attempts." >&2
          exit 1

name: Update profile

run-name: Update profile / ${{ inputs.correlation_id || github.event_name }}

on:
  pull_request:
  schedule:
    - cron: "17 19 * * *"
  workflow_dispatch:
    inputs:
      correlation_id:
        description: Optional identifier for a manual verification run
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: update-profile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-profile:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Validate Profile contract
        run: python -m unittest discover -s tests -v

  update-profile:
    if: github.event_name != 'pull_request' && github.ref_type == 'branch'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out triggering branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # Source: https://github.com/yoshi389111/github-profile-3d-contrib
      # Release: v0.9.3 (MIT)
      - name: Generate upstream Profile assets
        uses: yoshi389111/github-profile-3d-contrib@7d95e7d4cdc028dd1e1cbd957d65f35efb12ae39
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Validate GitBlock output
        run: |
          set -euo pipefail
          test -s profile-3d-contrib/profile-gitblock.svg
          python -c 'import xml.etree.ElementTree as ET; root = ET.parse("profile-3d-contrib/profile-gitblock.svg").getroot(); assert root.tag.rsplit("}", 1)[-1] == "svg"'

      - name: Commit generated Profile assets
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- profile-3d-contrib/
          if git diff --cached --quiet; then
            echo "Profile assets are unchanged."
            exit 0
          fi
          git commit -m "chore: refresh profile activity"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

name: Update profile

run-name: Update profile / ${{ inputs.correlation_id || 'scheduled' }}

on:
  pull_request:
  schedule:
    - cron: "19 18 * * 0"
  workflow_dispatch:
    inputs:
      correlation_id:
        description: Unique correlation ID for the requested run
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: update-profile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-profile:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out pull request
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.13"

      - name: Validate Profile
        run: |
          python -m unittest discover -s tests -v
          python scripts/validate_profile.py \
            --readme README.md \
            --svg assets/contribution-calendar.svg

  update-profile:
    if: github.event_name != 'pull_request' && github.ref_type == 'branch'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out default branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.13"

      - name: Run contract tests
        run: python -m unittest discover -s tests -v

      - name: Generate contribution calendar
        uses: yoshi389111/github-profile-3d-contrib@7d95e7d4cdc028dd1e1cbd957d65f35efb12ae39
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          MAX_REPOS: "100"

      - name: Install and validate generated calendar
        run: |
          set -euo pipefail
          test -s profile-3d-contrib/profile-night-green.svg
          install -m 0644 \
            profile-3d-contrib/profile-night-green.svg \
            assets/contribution-calendar.svg
          python scripts/validate_profile.py \
            --readme README.md \
            --svg assets/contribution-calendar.svg

      - name: Commit real calendar changes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- assets/contribution-calendar.svg
          if git diff --cached --quiet; then
            echo "Contribution calendar is unchanged."
            exit 0
          fi
          git commit -m "chore: refresh profile activity"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
